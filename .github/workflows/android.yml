name: Android

# The portable part of fontaine-android is built and tested by ci.yml on every OS; this workflow
# builds the Android-only layer and the APK, which need the NDK.
on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-ndk@4.1.2

      - name: Locate the NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n 1)" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo ndk -t arm64-v8a --platform 26 clippy -p fontaine-android --all-targets -- -D warnings

      # Debug-signed so it installs for a manual check; never uploaded as a release asset.
      - name: Build the APK
        run: fontaine-android/build-apk.sh "$RUNNER_TEMP/fontaine-android-debug.apk" --debug-sign

      - name: Upload the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fontaine-android-debug-apk
          path: ${{ runner.temp }}/fontaine-android-debug.apk
          retention-days: 7
