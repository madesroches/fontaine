# End-to-end self-update against the real GitHub feed: install the previous dev build with the real
# installer, update to the newest one, and check the version changed and the receipt is intact.
# Manual and nightly, never a PR gate: it needs two published `dev-<n>` builds and the network.
# The binary ships no api-base override, so this uses the default feed. Unix legs start the TUI under
# a pty so the automatic background pass runs; the Windows leg runs `fontaine update` (the helper
# swap needs a session holding the executable and is verified by hand).
name: Update E2E
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      FONTAINE_CONFIG_DIR: ${{ github.workspace }}/e2e/config
      FONTAINE_DATA_DIR: ${{ github.workspace }}/e2e/data
    steps:
      - name: Pick the previous dev build
        id: tags
        run: |
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '.[].tagName' | grep -E '^dev-[0-9]+$' | sort -t- -k2 -n -r)
          newest=$(echo "$tags" | sed -n 1p)
          previous=$(echo "$tags" | sed -n 2p)
          if [ -z "$previous" ]; then echo "fewer than two dev builds are published"; exit 1; fi
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Install the previous build with the real installer
        env:
          NEWEST: ${{ steps.tags.outputs.newest }}
          PREVIOUS: ${{ steps.tags.outputs.previous }}
          HOME_DIR: ${{ github.workspace }}/e2e/home
        run: |
          mkdir -p e2e/home e2e/config e2e/data
          base="https://github.com/madesroches/fontaine/releases/download/dev"
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl --proto '=https' --tlsv1.2 -LsSf "$base/fontaine-installer.ps1" -o e2e/installer.ps1
            sed -i "s/$NEWEST/$PREVIOUS/g" e2e/installer.ps1
            USERPROFILE="$(cygpath -w "$HOME_DIR")" LOCALAPPDATA="$(cygpath -w "$GITHUB_WORKSPACE/e2e/localappdata")" \
              powershell -ExecutionPolicy Bypass -File "$(cygpath -w e2e/installer.ps1)"
          else
            curl --proto '=https' --tlsv1.2 -LsSf "$base/fontaine-installer.sh" -o e2e/installer.sh
            sed -i.bak "s/$NEWEST/$PREVIOUS/g" e2e/installer.sh
            HOME="$HOME_DIR" XDG_CONFIG_HOME="$GITHUB_WORKSPACE/e2e/xdg" sh e2e/installer.sh
          fi

      - name: Update and check
        env:
          NEWEST: ${{ steps.tags.outputs.newest }}
          PREVIOUS: ${{ steps.tags.outputs.previous }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="$GITHUB_WORKSPACE/e2e/home/.fontaine/bin/fontaine.exe"
            receipt="$GITHUB_WORKSPACE/e2e/localappdata/fontaine/fontaine-receipt.json"
            export LOCALAPPDATA="$(cygpath -w "$GITHUB_WORKSPACE/e2e/localappdata")"
          else
            exe="$GITHUB_WORKSPACE/e2e/home/.fontaine/bin/fontaine"
            receipt="$GITHUB_WORKSPACE/e2e/xdg/fontaine/fontaine-receipt.json"
            export HOME="$GITHUB_WORKSPACE/e2e/home" XDG_CONFIG_HOME="$GITHUB_WORKSPACE/e2e/xdg"
          fi
          before=$(jq -r .version "$receipt")
          want_before="${PREVIOUS#dev-}"
          case "$before" in *"-dev.$want_before+"*) ;; *) echo "installed $before, expected build $want_before"; exit 1 ;; esac
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$exe" update
          else
            # The TUI needs a terminal; `script` provides a pty. The pass runs in the background
            # at start, so give it time to download, verify and swap before quitting.
            (sleep 90; printf '\003') | script -qec "$exe" /dev/null > /dev/null 2>&1 || true
          fi
          after=$(jq -r .version "$receipt")
          want_after="${NEWEST#dev-}"
          case "$after" in *"-dev.$want_after+"*) ;; *) echo "receipt says $after, expected build $want_after"; exit 1 ;; esac
          jq -e '.binaries[0] and .install_prefix' "$receipt" > /dev/null
          "$exe" --version
