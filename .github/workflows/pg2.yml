name: pg2

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Temporary: exercises this file on its own PR; remove once the PR run is green.
  pull_request:
    paths: ['.github/workflows/pg2.yml']

env:
  CARGO_TERM_COLOR: always
  # Each integration-test binary links the whole dependency tree; without debug info and
  # incremental state the runner's free disk is enough for one test build.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: test (pg2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Test (pg2)
        run: cargo test --features fontaine/pg2
