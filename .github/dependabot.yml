version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    # rig crates are pinned to exact versions on purpose.
    ignore:
      - dependency-name: "rig-*"
      # 0.22 splits JNIEnv into Env/EnvUnowned; fontaine-android needs a migration first.
      - dependency-name: "jni"
        update-types: ["version-update:semver-minor"]
    groups:
      cargo:
        update-types: [minor, patch]
