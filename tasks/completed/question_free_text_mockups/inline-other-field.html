<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Question dialog — inline "Other" field</title>
<style>
  :root {
    --bg: #17191c;
    --panel: #1e2126;
    --border: #3a3f46;
    --text: #d6d8db;
    --dim: #8a8f98;
    --heading: #ffc107;
    --chip: #7ab4e8;
    --field: #ffffff;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.5;
    margin: 0;
    padding: 24px;
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  figure { margin: 0; }
  figcaption { color: var(--dim); margin-bottom: 8px; }
  .term {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    width: 460px;
  }
  .bar { color: var(--dim); margin-bottom: 6px; }
  .chip {
    display: inline-block;
    border: 1px solid var(--chip);
    color: var(--chip);
    border-radius: 10px;
    padding: 0 8px;
    font-size: 12px;
    margin-bottom: 6px;
  }
  .q { font-weight: bold; margin-bottom: 8px; }
  .row { padding: 1px 4px; white-space: pre; }
  .row.sel { background: var(--text); color: var(--panel); font-weight: bold; }
  .row.sel .desc { color: #44484f; }
  .desc { color: var(--dim); padding-left: 3ch; display: block; }
  .other-field { color: var(--field); }
  .caret {
    display: inline-block;
    width: 7px;
    height: 15px;
    background: var(--field);
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .foot { color: var(--dim); margin-top: 8px; white-space: pre; }
</style>
</head>
<body>

<figure>
  <figcaption>1. Dialog opens — the textbox is already visible on the "Other" row, empty.</figcaption>
  <div class="term">
    <div class="bar">question</div>
    <div class="chip">Scope</div>
    <div class="q">How far should this change reach?</div>
    <div class="row sel">1. Just the dialog<span class="desc">   Only the question box changes.</span></div>
    <div class="row">2. Dialog and docs<span class="desc">   The key table in tui.md updates too.</span></div>
    <div class="row">3. Every surface<span class="desc">   Headless and MCP askers change as well.</span></div>
    <div class="row">4. Other: <span class="other-field"></span><span class="caret"></span></div>
    <div class="foot">type to answer in your own words · ↑/↓ move · Enter chooses · Esc declines</div>
  </div>
</figure>

<figure>
  <figcaption>2. Typing anywhere drops into the field — the highlight follows to "Other".</figcaption>
  <div class="term">
    <div class="bar">question</div>
    <div class="chip">Scope</div>
    <div class="q">How far should this change reach?</div>
    <div class="row">1. Just the dialog<span class="desc">   Only the question box changes.</span></div>
    <div class="row">2. Dialog and docs<span class="desc">   The key table in tui.md updates too.</span></div>
    <div class="row">3. Every surface<span class="desc">   Headless and MCP askers change as well.</span></div>
    <div class="row sel">4. Other: <span class="other-field">only if it stays smal</span><span class="caret"></span></div>
    <div class="foot">Enter confirms your words · Esc back to the options · typing replaces choosing</div>
  </div>
</figure>

</body>
</html>
