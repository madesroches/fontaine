[graph]
features = ["fontaine/pg2"]

[advisories]
version = 2
ignore = [
    # Reached only through rig-cassette's test-only replay server (httpmock); never in the shipped binary.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via httpmock in dev-only rig-cassette" },
    # candle-core (the pg2 scanner) pins `zip` 8 and a macro crate that is only unmaintained. The
    # zip advisories concern `extract()`, which candle never calls: it only reads single entries
    # of PyTorch checkpoints, and the scanner loads safetensors.
    { id = "RUSTSEC-2026-0367", reason = "zip via candle-core; extract() is never called" },
    { id = "RUSTSEC-2026-0368", reason = "zip via candle-core; extract() is never called" },
    { id = "RUSTSEC-2026-0369", reason = "zip via candle-core; extract() is never called" },
    { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained, compile-time only) via gemm in candle-core" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Goes away once micromegas 0.33 is on crates.io and Cargo.toml pins it exactly.
allow-git = ["https://github.com/madesroches/micromegas"]
