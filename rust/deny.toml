[graph]
features = ["fontaine/pg2"]

[advisories]
version = 2
ignore = [
    # Reached only through rig-cassette's test-only replay server (httpmock); never in the shipped binary.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via httpmock in dev-only rig-cassette" },
    { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained, compile-time only) via gemm in candle-core" },
    # chrono is unmaintained in every version, so no upgrade clears this. No workspace crate uses it
    # directly any more (#691); micromegas, rmcp, schemars, iroh-relay and wmi keep it in the graph
    # until they migrate. Re-check then, or drop this entry if chrono leaves the tree.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no safe upgrade; only third-party dependencies still pull it in" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    # Public-domain dedications reached through iroh's relay client (netwatch, ws_stream_wasm).
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
