[advisories]
version = 2
ignore = [
    # Reached only through rig-cassette's test-only replay server (httpmock); never in the shipped binary.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via httpmock in dev-only rig-cassette" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
