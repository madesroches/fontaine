[workspace]
resolver = "2"
members = ["*"]
exclude = ["target", ".cargo", ".fontaine", ".config", ".claude"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"
version = "0.1.0"
publish = false

[workspace.dependencies]
fontaine-core = { path = "fontaine-core" }
fontaine-tools = { path = "fontaine-tools" }
fontaine-guardian = { path = "fontaine-guardian" }
fontaine-agents = { path = "fontaine-agents" }
fontaine-mcp = { path = "fontaine-mcp" }
fontaine-tui = { path = "fontaine-tui" }

clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gix = { version = "=0.89.0", default-features = false, features = ["index", "sha1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
