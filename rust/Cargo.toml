[workspace]
resolver = "2"
members = ["*"]
exclude = ["target", ".cargo", ".fontaine", ".config", ".claude"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"
version = "0.1.0"
publish = false

[workspace.dependencies]
fontaine-core = { path = "fontaine-core" }
fontaine-tools = { path = "fontaine-tools" }
fontaine-guardian = { path = "fontaine-guardian" }
fontaine-agents = { path = "fontaine-agents" }
fontaine-mcp = { path = "fontaine-mcp" }
fontaine-tui = { path = "fontaine-tui" }

clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gix = { version = "=0.89.0", default-features = false, features = ["index", "sha1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# Pre-1.0 families are pinned exactly and upgraded deliberately.
rig-core = { version = "=0.45.0", features = ["reqwest"] }
rig-agent = "=0.45.0"
rig-memory = { version = "=0.45.0", features = ["fs"] }
rig-tools = "=0.45.0"
rig-cassette = { version = "=0.45.0", features = ["http", "agent"] }
micromegas-tracing = "=0.32.0"
micromegas-telemetry-sink = "=0.32.0"
micromegas-transit = "=0.32.0"
opentelemetry = "=0.33.1"
opentelemetry_sdk = "=0.33.1"
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
    "metrics",
    "logs",
] }
opentelemetry-appender-tracing = "=0.33.1"
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
tracing-opentelemetry = "=0.34.0"
jsonschema = "=0.59.0"
wiremock = "=0.6.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "charset", "http2", "system-proxy"] }
htmd = "=0.5.6"
ignore = "=0.4.33"
brush-parser = "=0.4.0"
toml_edit = "=0.25.17"
sha2 = "=0.11.1"
serde_jcs = "=0.2.0"
ratatui = "=0.30.2"

futures = "0.3.34"
insta = "1.49.0"
url = "2.5.8"
prost = "0.14.4"
rpassword = "7.5.4"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time", "sync"] }
uuid = { version = "1.28.0", features = ["v4"] }
