[workspace]
resolver = "2"
members = ["*"]
exclude = ["target", ".cargo", ".fontaine", ".config", ".claude"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99.1"
version = "0.1.0"
publish = false
repository = "https://github.com/madesroches/fontaine"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
fontaine-core = { path = "fontaine-core" }
fontaine-tools = { path = "fontaine-tools" }
fontaine-guardian = { path = "fontaine-guardian" }
fontaine-agents = { path = "fontaine-agents" }
fontaine-mcp = { path = "fontaine-mcp" }
fontaine-tui = { path = "fontaine-tui" }

chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "=0.29.0", features = ["osc52"] }
dirs = "7.0.0"
gix = { version = "=0.90.0", default-features = false, features = ["index", "sha1"] }
schemars = { version = "1.2.3", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
toml = "1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# Pre-1.0 families are pinned exactly and upgraded deliberately.
rig-core = { version = "=0.45.0", features = ["reqwest"] }
rig-agent = "=0.45.0"
rig-reqwest = "=0.45.0"
rig-memory = { version = "=0.45.0", features = ["fs"] }
rig-tools = "=0.45.0"
rig-rmcp = "=0.45.0"
webpki-root-certs = "=1.0.10"
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rig-cassette = { version = "=0.45.0", features = ["http", "agent"] }
# Git pin until micromegas 0.33 is on crates.io; see deny.toml.
micromegas-tracing = { git = "https://github.com/madesroches/micromegas", rev = "7a08f654105003a2a2c654d26a0843e9b3465054" }
micromegas-telemetry-sink = { git = "https://github.com/madesroches/micromegas", rev = "7a08f654105003a2a2c654d26a0843e9b3465054" }
micromegas-transit = { git = "https://github.com/madesroches/micromegas", rev = "7a08f654105003a2a2c654d26a0843e9b3465054" }
opentelemetry = "=0.33.1"
opentelemetry_sdk = "=0.33.1"
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
    "metrics",
    "logs",
] }
opentelemetry-appender-tracing = "=0.33.1"
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
tracing-opentelemetry = "=0.34.0"
jsonschema = "=0.59.0"
wiremock = "=0.6.5"
vt100 = "=0.18.1"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws-lc-rs"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "charset", "http2", "system-proxy"] }
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
htmd = "=0.5.6"
ignore = "=0.4.33"
globset = "=0.4.20"
brush-parser = "=0.4.0"
toml_edit = "=0.25.17"
yaml-rust2 = "=0.13.0"
sha2 = "=0.11.1"
serde_jcs = "=0.2.0"
async-lsp = { version = "=0.2.4", default-features = false, features = ["omni-trait", "tracing"] }
lsp-types = "=0.95.1"
tokio-util = { version = "0.7.20", features = ["compat"] }
pulldown-cmark = { version = "=0.13.6", default-features = false }
ratatui = { version = "=0.30.2", features = ["scrolling-regions", "unstable-backend-writer"] }

futures = "0.3.34"
insta = "1.49.0"
base64 = "0.22"
url = "2.5.8"
http = "1.5.0"
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time", "sync"] }
uuid = { version = "1.28.0", features = ["v4"] }
libc = "0.2.191"

# Release builds: pushing a `vX.Y.Z` tag runs `.github/workflows/release.yml`, which builds the
# `fontaine` binary and attaches it to a GitHub Release. Not published to crates.io.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = []
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"
# `.github/workflows/release.yml` is adapted by hand for the `rust/` workspace directory.
allow-dirty = ["ci"]
